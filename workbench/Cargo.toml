[package]
name = "civil-workbench"
version = "0.1.0"
edition = "2021"
description = "Civil Buddy workbench (Rust rewrite of demo/) plus per-category MCP"

[lib]
name = "civil_workbench"
path = "src/lib.rs"

[[bin]]
name = "civil-workbench"
path = "src/main.rs"

[[bin]]
name = "civil-mcp"
path = "src/bin/civil-mcp.rs"

[[bin]]
name = "civil-probe"
path = "src/bin/civil-probe.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
http-body-util = "0.1"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[bin]]
name = "civil-rag-probe"
path = "src/bin/civil-rag-probe.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
