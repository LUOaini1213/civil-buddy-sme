name: ci-smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ux(round23)：补 exe 侧门禁。此前 ci.yml **完全不跑 cargo**（只有
  # test_rag_parity.py --skip-rust），workbench/tests/ 下的 Rust 门禁从来没在 CI
  # 上执行过 —— 后果是发版前一查，三条断言已经烂了好几轮没人看见：
  #   · 断言 index.html 含 `ctxBar`，而 round19 P0 就把它删了
  #   · 断言联网知识含写死的 "2026-08-14"，刷新一篇就红
  #   · 断言 app.js 含「能聊能跑」，这句文案早没了
  # 评委下载运行的正是这个 exe，它的测试不能只靠本机想起来才跑。
  rust:
    runs-on: ubuntu-latest
    # a hung cargo test or host smoke used to hold the runner for GitHub's 360-minute default; runs take ~3 min
    timeout-minutes: 30
    env:
      PYTHON_DOTENV_DISABLED: "1"
      CIVIL_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Deterministic Python worker dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-documents.txt -r requirements-engineering.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workbench
      - name: cargo test
        working-directory: workbench
        run: cargo test --locked -- --test-threads=1
      - name: Build the host and verify authenticated restart and handoff
        run: |
          cargo build --locked --manifest-path workbench/Cargo.toml --bin civil-workbench
          python scripts/start_unified_workbench.py --python python --binary workbench/target/debug/civil-workbench --check
          python scripts/test_unified_runtime_http.py --binary workbench/target/debug/civil-workbench

  smoke:
    runs-on: ubuntu-latest
    # runs take ~13 min; without this a hang held the runner for the 360-minute default
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -r requirements-engineering.txt
          pip install -r requirements-documents.txt
          # 语音输入的解码守卫（协议白名单、采样率、时长上限）要真解码才能测；不下载模型
          pip install -r requirements-asr.txt
          # ui-dom（真页面 + 真后端跑在 jsdom 里）和它的打包器都是 devDependencies
          npm ci --no-audit --no-fund
      - name: Workbench HTTP and knowledge-base tests
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: python -m pytest demo/tests -q --basetemp=output/pytest-ci
      - name: Project records, delivery checks and transport refusal
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          node scripts/test_project_control_ui.cjs
          node scripts/test_agent_ui.cjs
          node scripts/test_logistics_language.cjs
          python scripts/test_document_readiness.py
          python scripts/test_transport_constraints.py
          python scripts/test_model_refusal.py
          python scripts/test_model_mode_link.py
          python scripts/eval_model_mode.py --check
      - name: Voice input eval archive matches its README (no model needed)
        run: python eval/asr/run_eval.py --check
      - name: Import package
        run: python -c "from packing_assistant.config import HARNESS_VERSION; from packing_assistant.harness import iter_agent_pipeline; print(HARNESS_VERSION)"
      - name: MCP tool surface (stdio protocol, scoped tools, host client, solver wiring)
        run: |
          python scripts/test_mcp_stdio.py
          python scripts/test_mcp_surface.py
          python scripts/test_mcp_host_client.py
          python scripts/test_pack_ship_solver_mcp.py
          python scripts/test_packing_list_pdf.py
          python scripts/test_table_mapper_unit.py
          python scripts/test_pack_ship_dimension_gate.py
          python scripts/test_pack_ship_conservation.py
          python scripts/test_pack_ship_crates_structure.py
      - name: Frontend static checks
        run: |
          # UX R12: 零外链红线（内网断网可用）+ JS 语法门禁（node --check 固化 U-R10 esprima 检查）
          python scripts/test_no_external_urls.py
          python scripts/test_js_syntax.py
          # 符号纪律（此前只在本地 precommit 跑）：voice.js 的按钮文字不许用 emoji 或录音符号
          python scripts/test_ux_no_emoji.py
          # UX R16: Vue 模板绑定必须有定义（渲染期 ReferenceError = 整页白屏，语法门禁抓不到）
          python scripts/test_vue_bindings.py
          # ux(round19): 项目索引双栈对拍（自造 fixture，不依赖存量数据）
          python scripts/test_projects_parity.py
          # ux(round22): 物料来源诚实性 —— 给了路径读不到必须说，不许静默用演示物料
          python scripts/test_materials_notice.py
          # 双保险: 独立 js 逐个 node --check（runner 自带 node，必跑；-e 任一失败即红）
          while IFS= read -r -d '' f; do node --check "$f"; done \
            < <(find frontend demo/static workbench/src -name '*.js' -not -path '*/target/*' -print0 2>/dev/null)
          python - <<'PY'
          from pathlib import Path
          # 83a2cb5 起 index.html 是 Civil Codex 宿主页；大 Team 工程台功能在 workbench.html
          idx = Path("frontend/index.html").read_text(encoding="utf-8")
          for k in ["Civil Buddy", "/workbench"]:
              assert k in idx, ("index.html", k)
          w = Path("frontend/workbench.html").read_text(encoding="utf-8")
          need = [
              "大 Team", "org-chart", "/api/pipeline", "consumeSse", "hitl_summary",
              "draw3d", "TEAM_ROSTER", "/api/whatif", "What-if", "订柜 N0", "3D 用柜",
              "perCabinCog", "secureWorkOrder", "big_team_a_b",
          ]
          miss = [k for k in need if k not in w]
          assert not miss, miss
          # UX R13: R5-R12 轮次 UI 标记不丢（审批卡/审计时间线/斜杠面板/空态卡/主题持久化）
          ux_marks = {
              "frontend/workbench.html": ["cb-apr", "data-cb-audit-panel", "cbSlashFilter", "cb-empty-card", "cb_theme_v1", "cbThemeBtn", "cbNewTask", "cbPlusOpen", "回工作台"],
              "demo/static/index.html": ["data-cb-audit-panel", "cb-empty-card", "cb_theme_v1", "cbThemeBtn", "cb-empty-hint", "btnVoice", "/static/voice.js"],
              "demo/static/app.js": ["确认并重提", "handleSlash", "cb_theme_v1", "cbIsPackOpenWord", "cbOpenPackStudio", "cbDirectMatch"],
          }
          for path, marks in ux_marks.items():
              text = Path(path).read_text(encoding="utf-8")
              miss2 = [k for k in marks if k not in text]
              assert not miss2, (path, miss2)
          print("frontend OK")
          PY
      - name: Pipeline unit smoke
        run: |
          python - <<'PY'
          from packing_assistant.harness import run_agent_pipeline
          st = run_agent_pipeline(
              "CI 钢梁 6000x200x300 400kg x1",
              enable_auto_confirm=True,
              session_id="ci-smoke",
              save_artifacts=True,
          )
          assert st.get("agent_steps"), "no steps"
          assert st.get("team_mode") == "big_team_a_b", st.get("team_mode")
          paths = st.get("artifact_paths") or {}
          print("phase", st.get("phase"), "team_mode", st.get("team_mode"), "steps", len(st["agent_steps"]), "paths", list(paths)[:6])
          PY
      - name: Phase0 baseline quick (agency scorecard)
        run: python scripts/run_phase0_baseline.py --quick
      - name: Anchor tools + over-payload replan (skip long pipeline)
        run: python scripts/test_anchor_t80_long_mix.py
        env:
          ANCHOR_SKIP_PIPELINE: "1"
      - name: Booking dual-volume metrics
        run: python scripts/test_booking_volume_metrics.py
      - name: HITL disk resume (3 cases)
        run: python scripts/test_hitl_resume_competition.py
      - name: Workteams shadow eval (steps vs llm) + KPI
        # No key in CI, so the llm arm runs as policy_fallback (harness._path_honesty);
        # this covers the plumbing and the steps-vs-llm agreement check, not a live model.
        run: python scripts/eval_workteams_cli.py --tiny-only
      - name: Trace store creates the parent session row (issue 22 regression)
        run: python scripts/test_storage_ensure_run.py
      - name: Downloadable trace preserves SQLite tool and terminal events
        run: python scripts/test_trace_artifact_export.py
      - name: Complete no-key product demo
        run: python scripts/demo_one_shot.py --all
      - name: Agent middleware four-beat script (policy deny / recovery chain / cost fuse)
        # The three guarantees the README leads with, asserted rather than demoed.
        run: python scripts/test_agent_middleware.py
      - name: "Contest gate (npm run check: secret scan, sandbox, civil codex, offline eval)"
        run: npm run check
      - name: TMS booking stub
        run: |
          python - <<'PY'
          from packing_assistant.harness import run_agent_pipeline
          from packing_assistant.tms_booking import submit_booking, attach_booking_to_state
          st = run_agent_pipeline(
              "TMS stub 钢架",
              materials=[{
                  "id": "m1", "part_no": "FST", "length_mm": 3000, "width_mm": 200,
                  "height_mm": 200, "total_weight_kg": 200, "qty": 1,
              }],
              enable_auto_confirm=True,
              session_id="ci-tms",
              save_artifacts=False,
          )
          r = submit_booking(st)
          assert r.get("ok"), r
          assert r.get("booking_id") or (r.get("booking_summary") or {}).get("booking_id")
          st2 = attach_booking_to_state(st, r)
          assert st2.get("tms_booking", {}).get("booking_id")
          print("TMS", st2["tms_booking"])
          PY
      - name: Agent auto + whatif + continue
        run: |
          python scripts/test_agent_auto_mode.py
          python scripts/test_whatif_accept.py
          python scripts/test_continue_improve.py
      - name: Eval harness tiny/20t (no t80 file)
        run: python scripts/eval_harness_cli.py
      - name: P0 P1 P2 full chain
        run: python scripts/test_p0_p1_p2_full.py
      - name: D-R3 RAG parity + golden recall + hardcode grep (FTS5)
        run: python scripts/test_rag_parity.py --skip-rust
      - name: Frontend whatif/profile strings
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path("frontend/workbench.html").read_text(encoding="utf-8")
          for k in ["/api/whatif/apply", "/api/profiles", "POR 装柜单", "应用为当前方案"]:
              assert k in t, k
          print("frontend continue OK")
          PY
      - name: Fan-out evaluation archive matches the README numbers
        run: python scripts/render_eval_table.py --check README.md
      - name: P0 cog t80 (if materials present)
        run: |
          if [ -f test/sim_materials/t80_random_mixed_s20260729/materials.json ]; then
            python scripts/test_p0_cog_t80.py
          else
            echo "skip t80 materials not in repo"
          fi

  # A slice of the 128-run packing evaluation (16 lanes × 8 rounds locally,
  # docs/eval/fanout16x8-2026-09-02/): 2 lanes × 1 round on the committed
  # public cargo samples, no network, no key. Proves the pipeline the archive
  # was produced with still completes end to end on every push.
  packing-eval-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: 2 lanes × 1 round, offline cargo cache
        run: python scripts/fanout16x8_online_cargo.py --lanes 2 --rounds 1 --workers 2 --skip-fetch
      - name: Slice must be all green
        run: |
          python - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path("output/fanout16x8/rollup.json").read_text(encoding="utf-8"))
          assert r["all_green"] and r["total_pass"] == r["total_runs_expected"] == 2, r
          print("slice", r["total_pass"], "/", r["total_runs_expected"], "wall", r["wall_s"], "s")
          PY

  # The Docker image a judge or operator starts with `docker compose up`. Until this job it was
  # never started in CI, and it did not start at all (contract/ and workbench/seed.json were not
  # copied; the database sat outside the volume). Build with the GitHub layer cache, then run
  # scripts/docker_smoke.sh (refuses without CIVIL_TOKEN, 401/200 on the token, parses the
  # synthetic ITT, database survives a container re-create) and the compose file itself.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: civil-buddy-gateway:smoke
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,scope=docker-smoke,mode=max
      - name: Image size
        run: docker image ls civil-buddy-gateway:smoke
      - name: Container smoke (token guard, tender parse, database persistence)
        run: bash scripts/docker_smoke.sh civil-buddy-gateway:smoke
      - name: docker compose up / down / up keeps the session
        run: |
          set -euo pipefail
          if docker compose config >/dev/null 2>&1; then
            echo "FAIL: compose accepted a missing CIVIL_TOKEN"; exit 1
          fi
          echo "ok   compose refuses to start without CIVIL_TOKEN"
          export CIVIL_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker tag civil-buddy-gateway:smoke "$(docker compose config --images)"
          up() {
            docker compose up -d --no-build
            for _ in $(seq 1 150); do curl -fs -o /dev/null http://127.0.0.1:8000/api/health && return 0; sleep 0.2; done
            echo "FAIL: compose service not healthy"; exit 1
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          up
          test "$(code http://127.0.0.1:8000/api/tools)" = 401
          test "$(code -H "Authorization: Bearer $CIVIL_TOKEN" http://127.0.0.1:8000/api/tools)" = 200
          echo "ok   compose: 401 without token, 200 with it"
          test "$(code -H "Authorization: Bearer $CIVIL_TOKEN" -H 'content-type: application/json' \
                 --data '{"session_id":"compose-smoke"}' http://127.0.0.1:8000/api/demo)" = 200
          docker compose down
          up
          curl -fs -H "Authorization: Bearer $CIVIL_TOKEN" http://127.0.0.1:8000/api/audit \
            | python3 -c 'import json,sys; ids=[s["session_id"] for s in json.load(sys.stdin)["sessions"]]; assert "compose-smoke" in ids, ids'
          echo "ok   compose: session survived docker compose down + up"
      - name: Lightsail kit rehearsal (launch script + compose override + Caddy on this runner; not a Lightsail run)
        run: |
          set -euo pipefail
          docker compose down -v || true
          # the launch script clones this checkout at HEAD (the PR merge commit exists only here)
          bash deploy/lightsail/test-local.sh "$(git rev-parse HEAD)"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Clean up
        if: always()
        run: docker compose down -v || true
